[project]
name = "turbo-neat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "evojax>=0.2.17",
    "graphviz>=0.21",
    "jax>=0.10.2",
    "wandb>=0.30.0",
]

[project.optional-dependencies]
# GPU build of jax; ./install.sh adds this when it finds an NVIDIA GPU
cuda = ["jax[cuda13]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neat_jax"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    # evojax's slimevolley task imports cv2 without declaring it (examples/slimevolley.py)
    "opencv-python-headless>=5.0.0.93",
]
